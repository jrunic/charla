name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências de dev
        run: python -m pip install -e ".[dev]"

      - name: Pytest (suíte completa)
        run: python -m pytest -q

      - name: Ruff
        run: python -m ruff check .

  build:
    name: Build charla.pyz
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Montar charla.pyz
        run: |
          python scripts/build-pyz.py
          ls -lh dist/

      - name: Check tag == versão do pacote
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="$(python3 dist/charla.pyz versao | awk '{print $2}')"
          TAGV="${GITHUB_REF_NAME#v}"
          if [ "$V" != "$TAGV" ]; then
            echo "::error::versão do pacote (${V}) difere da tag (v${TAGV}) — bump _version.py/pyproject antes de re-taggear"
            exit 1
          fi

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum -- charla.pyz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: charla-pyz
          path: |
            dist/charla.pyz
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: charla-pyz
          path: dist

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          NOTES_FILE=$(mktemp)
          awk "/^## \\[${VERSION}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md > "${NOTES_FILE}"
          if [ ! -s "${NOTES_FILE}" ]; then
            echo "::error::CHANGELOG.md has no entry for ## [${VERSION}] — update CHANGELOG before re-publishing the tag."
            exit 1
          fi
          echo "notes_path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
          echo "---- Release notes ----"
          cat "${NOTES_FILE}"
          echo "---- End ----"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes_path }}
          files: |
            dist/charla.pyz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
